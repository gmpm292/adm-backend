type PaymentProcessingResult {
  workerId: Int!
  workerName: String
  amount: Float!
  currency: String!
  paymentConcept: String!
  status: String!
  errors: [String!]
  details: JSON
}

type PaymentProcessingSummary {
  data: [PaymentProcessingResult!]!
  totalCount: Int!
  successCount: Int!
  errorCount: Int!
}

# Input para procesamiento batch
input ProcessPaymentsInput {
  payrollPeriodId: Int!
  businessId: Int
  officeId: Int
  departmentId: Int
  teamId: Int
  workerIds: [Int!]
  force: Boolean
}

# Input para procesamiento en tiempo real de venta
input ProcessSalePaymentInput {
  saleId: Int!
}

# Input para reversión de pagos de venta
input RollbackSalePaymentsInput {
  saleId: Int!
  reason: String!
  compensateInNextPeriod: Boolean
  nextPeriodId: Int
}

# Resultado de procesamiento de venta
type SalePaymentProcessingResult {
  success: Boolean!
  paymentsCreated: Int!
  totalAmount: Float!
  saleId: Int!
  details: [JSON!]!
}

# Resultado de reversión de venta
type RollbackSalePaymentsResult {
  success: Boolean!
  originalPaymentsReversed: Int!
  compensationPaymentsCreated: Int!
  nextPeriodId: Int
  details: [JSON!]!
}

# NOTA: extend type Query removido porque está vacío
# Se agregará cuando tengamos queries implementadas

extend type Mutation {
  # Procesar pagos batch (FIXED_AMOUNT)
  processPayments(
    processPaymentsInput: ProcessPaymentsInput!
    scopes: [ScopedAccessEnum!]
  ): PaymentProcessingSummary!

  # Procesar pagos de una venta en tiempo real
  processSalePayment(
    processSalePaymentInput: ProcessSalePaymentInput!
    scopes: [ScopedAccessEnum!]
  ): SalePaymentProcessingResult!

  # Revertir pagos de una venta (devolución/cancelación)
  rollbackSalePayments(
    rollbackSalePaymentsInput: RollbackSalePaymentsInput!
    scopes: [ScopedAccessEnum!]
  ): RollbackSalePaymentsResult!

  # TODO: Implementar luego
