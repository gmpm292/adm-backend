type PaymentProcessingResult {
  workerId: Int!
  workerName: String
  amount: Float!
  currency: String!
  paymentConcept: String!
  status: String!
  errors: [String!]
  details: JSON
}

type PaymentProcessingSummary {
  data: [PaymentProcessingResult!]!
  totalCount: Int!
  successCount: Int!
  errorCount: Int!
}

input ProcessPeriodPaymentsInput {
  payrollPeriodId: Int
  businessId: Int
  officeId: Int
  departmentId: Int
  teamId: Int
  workerIds: [Int!]
  force: Boolean
}

input ProcessSalePaymentInput {
  saleId: Int!
}

input RollbackSalePaymentsInput {
  saleId: Int!
  reason: String!
  compensateInNextPeriod: Boolean
  nextPeriodId: Int
}

type SalePaymentProcessingResult {
  success: Boolean!
  paymentsCreated: Int!
  totalAmount: Float!
  saleId: Int!
  details: [JSON!]!
}

type RollbackSalePaymentsResult {
  success: Boolean!
  originalPaymentsReversed: Int!
  compensationPaymentsCreated: Int!
  nextPeriodId: Int
  details: [JSON!]!
}

type BatchSalePaymentResult {
  saleId: Int!
  success: Boolean!
  paymentsCreated: Int!
  totalAmount: Float!
  error: String
  details: [JSON!]!
}

type PeriodSalesProcessingResult {
  success: Boolean!
  payrollPeriodId: Int!
  totalSales: Int!
  successful: Int!
  failed: Int!
  totalPaymentsCreated: Int!
  totalAmount: Float!
  results: [BatchSalePaymentResult!]!
}

type BatchSaleProcessingResult {
  success: Boolean!
  totalProcessed: Int!
  successful: Int!
  failed: Int!
  results: [BatchSalePaymentResult!]!
}

extend type Mutation {
  processPeriodPayments(
    processPeriodPaymentsInput: ProcessPeriodPaymentsInput!
  ): PaymentProcessingSummary!

  processSalePayment(
    processSalePaymentInput: ProcessSalePaymentInput!
  ): SalePaymentProcessingResult!

  processBatchSalePayments(saleIds: [Int!]!): BatchSaleProcessingResult!

  processPeriodSales(payrollPeriodId: Int!): PeriodSalesProcessingResult!

  rollbackSalePayments(
    rollbackSalePaymentsInput: RollbackSalePaymentsInput!
  ): RollbackSalePaymentsResult!

  # TODO: Implementar luego
  # approvePayments(paymentIds: [Int!]!): Int!

  # TODO: Implementar luego
  # rejectPayments(
  #   paymentIds: [Int!]!
  #   reason: String!
  # ): Int!
}
