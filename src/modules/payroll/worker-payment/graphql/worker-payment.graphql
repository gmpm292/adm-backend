"""
Description: Records payments made to workers (salary, commissions, bonuses).
"""
enum PaymentConcept {
  SALARY
  COMMISSION
  BONUS
  OTHER
}

type WorkerPayment implements SecurityBaseEntity {
  id: Int!
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date

  createdBy: User
  updatedBy: User
  deletedBy: User

  business: Business
  office: Office
  department: Department
  team: Team

  worker: Worker!
  sale: Sale # Relación directa a la venta (nullable)
  paidDate: Date # Day it was paid. If null, it has not been carried out.
  amount: Float!
  currency: String!
  exchangeRate: Float
  paymentMethod: PaymentMethod!
  paymentConcept: PaymentConcept! # Usamos paymentConcept como en la entidad
  payrollPeriod: PayrollPeriod!
  breakdown: PaymentBreakdown
  notes: String
}

type PaymentBreakdown {
  ruleName: String
  ruleType: String
  baseSalary: Float
  commissions: Float
  bonuses: Float
  deductions: Float
}

enum PaymentMethod {
  CASH
  BANK_TRANSFER
  CHECK
  MOBILE_PAYMENT
  OTHER
}

type WorkerPaymentsSummary {
  data: [WorkerPayment]!
  totalCount: Int!
}

input CreateWorkerPaymentInput {
  businessId: Int
  officeId: Int
  departmentId: Int
  teamId: Int

  workerId: Int!
  payrollPeriodId: Int!
  saleId: Int # Opcional, relación con venta
  paidDate: Date # Opcional, fecha de pago
  amount: Float!
  currency: String!
  exchangeRate: Float
  paymentMethod: PaymentMethod!
  paymentConcept: PaymentConcept!
  breakdown: PaymentBreakdownInput
  notes: String
}

input PaymentBreakdownInput {
  ruleName: String
  ruleType: String
  baseSalary: Float
  commissions: Float
  bonuses: Float
  deductions: Float
}

input UpdateWorkerPaymentInput {
  businessId: Int
  officeId: Int
  departmentId: Int
  teamId: Int

  id: Int!
  workerId: Int
  payrollPeriodId: Int
  saleId: Int
  paidDate: Date
  amount: Float
  currency: String
  exchangeRate: Float
  paymentMethod: PaymentMethod
  paymentConcept: PaymentConcept
  breakdown: PaymentBreakdownInput
  notes: String
}

extend type Query {
  workerPayments(options: ListOptions): WorkerPaymentsSummary!
  workerPayment(id: Int!): WorkerPayment
  paymentsByWorker(workerId: Int!): [WorkerPayment]!
  paymentsByPeriod(periodId: Int!): [WorkerPayment]!
#  paymentsBySale(saleId: Int!): [WorkerPayment]! # Nueva query para pagos por venta
#  paymentsByStatus(paid: Boolean!): [WorkerPayment]! # Nueva query para pagos realizados/pendientes
}

extend type Mutation {
  createWorkerPayment(
    createWorkerPaymentInput: CreateWorkerPaymentInput!
  ): WorkerPayment!
  updateWorkerPayment(
    updateWorkerPaymentInput: UpdateWorkerPaymentInput!
  ): WorkerPayment!
#  markAsPaid(id: Int!, paidDate: Date!): WorkerPayment! # Nueva mutation para marcar como pagado
  removeWorkerPayments(ids: [Int!]!): [WorkerPayment]!
  restoreWorkerPayments(ids: [Int!]!): Int
}

extend type Subscription {
  workerPaymentChanged: Boolean
}
