enum WorkerType {
  PUBLICIST
  ECONOMIC
  SERVICE
  COURIER
  TECHNICIAN
  OPERATIVE
  COMMUNITY_MANAGER

  PRINCIPAL
  ADMINISTRATIVE
  MANAGER
  SUPERVISOR
  AGENT
  
  OTHER
}

type Worker implements SecurityBaseEntity {
  id: Int!
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date

  createdBy: User
  updatedBy: User
  deletedBy: User

  business: Business
  office: Office
  department: Department
  team: Team

  workerType: WorkerType!
  otherType: String
  baseSalary: Float!
  customPaymentSettings: JSON
  user: User
  paymentRule: PaymentRule

  # Campos temporales
  tempFirstName: String
  tempLastName: String
  tempEmail: String
  tempPhone: String
  tempRole: [Role!]
}

type WorkersSummary {
  data: [Worker]!
  totalCount: Int!
}

"""
Los datos propios (temp*) son el nombre y contacto del trabajador; se usan
cuando no tiene cuenta de usuario vinculada.
"""
input CreateWorkerInput {
  businessId: Int
  officeId: Int
  departmentId: Int
  teamId: Int

  "Cuenta de usuario existente que se vincula"
  userId: Int
  workerType: WorkerType!
  otherType: String
  paymentRuleId: Int
  baseSalary: Float
  customPaymentSettings: JSON

  tempFirstName: String
  tempLastName: String
  tempEmail: String
  tempPhone: String
}

"""
null vacía un dato (userId desvincula la cuenta). El lugar se cambia entero:
si llega uno de businessId/officeId/departmentId/teamId, los que no lleguen
quedan vacíos.
"""
input UpdateWorkerInput {
  businessId: Int
  officeId: Int
  departmentId: Int
  teamId: Int

  id: Int!
  userId: Int
  workerType: WorkerType
  otherType: String
  paymentRuleId: Int
  baseSalary: Float
  customPaymentSettings: JSON

  tempFirstName: String
  tempLastName: String
  tempEmail: String
  tempPhone: String
}

extend type Query {
  workers(options: ListOptions): WorkersSummary!
  worker(id: Int!): Worker
}

extend type Mutation {
  createWorker(createWorkerInput: CreateWorkerInput!): Worker!
  updateWorker(updateWorkerInput: UpdateWorkerInput!): Worker!
  removeWorkers(ids: [Int!]!): [Worker]!
  restoreWorkers(ids: [Int!]!): Int
}

