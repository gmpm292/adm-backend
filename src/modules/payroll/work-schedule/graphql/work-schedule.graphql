"""
Description: Semana (o tramo) de trabajo de una oficina con sus días laborables.
"""
type WorkSchedule implements SecurityBaseEntity {
  id: Int!
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date

  createdBy: User
  updatedBy: User
  deletedBy: User

  business: Business
  office: Office
  department: Department
  team: Team

  name: String!
  startDate: Date!
  endDate: Date!
  workingDays: WorkDays!
  notes: String
}

type WorkDays {
  monday: Boolean!
  tuesday: Boolean!
  wednesday: Boolean!
  thursday: Boolean!
  friday: Boolean!
  saturday: Boolean!
  sunday: Boolean!
}

type WorkSchedulesSummary {
  data: [WorkSchedule]!
  totalCount: Int!
}

input CreateWorkScheduleInput {
  businessId: Int
  "Sin oficina, el horario vale para toda la empresa"
  officeId: Int
  departmentId: Int
  teamId: Int

  name: String!
  startDate: Date!
  endDate: Date!
  workingDays: WorkDaysInput!
  notes: String
}

input WorkDaysInput {
  monday: Boolean!
  tuesday: Boolean!
  wednesday: Boolean!
  thursday: Boolean!
  friday: Boolean!
  saturday: Boolean!
  sunday: Boolean!
}

input UpdateWorkScheduleInput {
  id: Int!
  "null lo deja para toda la empresa"
  officeId: Int
  name: String
  startDate: Date
  endDate: Date
  workingDays: WorkDaysInput
  "null la borra"
  notes: String
}

extend type Query {
  workSchedules(options: ListOptions): WorkSchedulesSummary!
  workSchedule(id: Int!): WorkSchedule
  workSchedulesByOffice(officeId: Int!): [WorkSchedule]!
}

extend type Mutation {
  createWorkSchedule(
    createWorkScheduleInput: CreateWorkScheduleInput!
  ): WorkSchedule!
  updateWorkSchedule(
    updateWorkScheduleInput: UpdateWorkScheduleInput!
  ): WorkSchedule!
  removeWorkSchedules(ids: [Int!]!): [WorkSchedule]!
  restoreWorkSchedules(ids: [Int!]!): Int
}

extend type Subscription {
  workScheduleChanged: Boolean
}
