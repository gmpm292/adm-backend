enum PaymentMethod {
  CASH
  CARD
  TRANSFER
  OTHER
}

enum SaleStatus {
  DRAFT # Borrador, sin efectividad
  CONFIRMED # Venta efectiva/completada
  CANCELLED # Cancelada
  PARTIALLY_REFUNDED # Devolución parcial
  FULLY_REFUNDED # Devolución total
}

type Sale implements SecurityBaseEntity {
  id: Int!
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date

  createdBy: User
  updatedBy: User
  deletedBy: User

  business: Business
  office: Office
  department: Department
  team: Team

  effectiveDate: Date
  isConfirmed: Boolean
  totalAmount: Float
  paymentMethod: PaymentMethod
  invoiceNumber: String
  paymentDetails: JSON
  salesUser: User
  customer: Customer
  details: [SaleDetail]
  saleStatus: SaleStatus

  # NUEVOS CAMPOS DE MENSAJERÍA
  hasDelivery: Boolean
  deliveryWorker: Worker
  deliveryNotes: String
}

type SalesSummary {
  data: [Sale]!
  totalCount: Int!
}

type SalePaymentValidation {
  valid: Boolean
  message: String
  totalInBaseCurrency: Float
}

input CreateSaleInput {
  businessId: Int!
  officeId: Int!
  departmentId: Int
  teamId: Int

  salesWorkerId: Int
  customerId: Int
  #totalAmount: Float!
  #effectiveDate: Date
  paymentMethod: PaymentMethod!
  paymentDetails: JSON
  invoiceNumber: String
  details: [SaleDetailInput!]!

  # NUEVOS CAMPOS DE MENSAJERÍA
  hasDelivery: Boolean
  deliveryWorkerId: Int
  deliveryNotes: String
}

input SaleDetailInput {
  productId: Int!
  quantity: Float!
  publicistIds: [Int!]
}

input UpdateSaleInput {
  businessId: Int!
  officeId: Int!
  departmentId: Int
  teamId: Int

  id: Int!
  salesWorkerId: Int
  customerId: Int
  #totalAmount: Float
  paymentMethod: PaymentMethod
  paymentDetails: JSON
  invoiceNumber: String

  # NUEVOS CAMPOS DE MENSAJERÍA
  hasDelivery: Boolean
  deliveryWorkerId: Int
  deliveryNotes: String
}

input MakeSalePaymentInput {
  amount: Float!
  currency: String!
  paymentMethod: PaymentMethod!
}

input MakeSaleInput {
  saleId: Int!
  payments: [MakeSalePaymentInput!]!
  baseCurrency: String
  customDate: Date
}

input ValidateSalePaymentsInput {
  saleId: Int!
  payments: [MakeSalePaymentInput!]!
  baseCurrency: String
}

input RefundSaleInput {
  saleId: Int
  saleDetailIds: [Int!]
}

extend type Query {
  sales(options: ListOptions): SalesSummary!
  sale(id: Int!): Sale
  salesByCustomer(customerId: Int!): [Sale]!
}

extend type Mutation {
  createSale(createSaleInput: CreateSaleInput!): Sale!
  updateSale(updateSaleInput: UpdateSaleInput!): Sale!
  removeSales(ids: [Int!]!): [Sale]!
  restoreSales(ids: [Int!]!): Int

  makeSale(makeSaleInput: MakeSaleInput!): Sale!
  validateSalePayments(
    validateSalePaymentsInput: ValidateSalePaymentsInput
  ): SalePaymentValidation!

  refundSale(refundSaleInput: RefundSaleInput!): Sale!
}

extend type Subscription {
  saleChanged: Boolean
}
