enum PaymentMethod {
  CASH
  CARD
  TRANSFER
  OTHER
}

enum SaleStatus {
  DRAFT # Borrador, sin efectividad
  CONFIRMED # Venta efectiva/completada
  CANCELLED # Cancelada
  PARTIALLY_REFUNDED # Devolución parcial
  FULLY_REFUNDED # Devolución total
}

type Sale implements SecurityBaseEntity {
  id: Int!
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date

  createdBy: User
  updatedBy: User
  deletedBy: User

  business: Business
  office: Office
  department: Department
  team: Team

  effectiveDate: Date
  isConfirmed: Boolean
  totalAmount: Float
  paymentMethod: PaymentMethod
  invoiceNumber: String
  paymentDetails: JSON
  salesUser: User @deprecated(reason: "Siempre nulo: usar salesWorker")
  salesWorker: Worker
  totalAmountCurrency: String
  # Suma, en totalAmountCurrency, de lo devuelto por refundSale.
  refundedAmount: Float
  # Pagos recibidos: [{ amount, currency, paymentMethod }]
  payments: JSON
  customer: Customer
  details: [SaleDetail]
  saleStatus: SaleStatus

  # NUEVOS CAMPOS DE MENSAJERÍA
  hasDelivery: Boolean
  deliveryWorker: Worker
  deliveryNotes: String
}

type SalesSummary {
  data: [Sale]!
  totalCount: Int!
}

type SaleCurrencyTotal {
  currency: String!
  total: Float!
}

type SalePaymentValidation {
  valid: Boolean
  message: String
  # Moneda en la que se expresan los importes
  currency: String
  # Precio de la venta
  totalInBaseCurrency: Float
  paidInBaseCurrency: Float
  pendingInBaseCurrency: Float
  changeInBaseCurrency: Float
  # Precio en cada moneda en que la venta puede cobrarse completa
  totals: [SaleCurrencyTotal!]
}

type SaleQuotePrice {
  currency: String!
  unitPrice: Float!
  total: Float!
}

type SaleQuoteLine {
  productId: Int!
  quantity: Float!
  available: Float!
  prices: [SaleQuotePrice!]!
  error: String
}

type SaleQuote {
  valid: Boolean!
  message: String
  currency: String
  totalInBaseCurrency: Float!
  paidInBaseCurrency: Float!
  pendingInBaseCurrency: Float!
  changeInBaseCurrency: Float!
  totals: [SaleCurrencyTotal!]!
  lines: [SaleQuoteLine!]!
}

type SaleCatalogOffice {
  id: Int!
  name: String!
  businessId: Int!
  businessName: String
}

type SaleCatalogCurrency {
  code: String!
  name: String!
  symbol: String!
  exchangeRateToCUP: Float!
}

type SaleCatalogCategory {
  id: Int!
  name: String!
}

type SaleCatalogPrice {
  currency: String!
  unitPrice: Float!
}

type SaleCatalogProduct {
  id: Int!
  name: String!
  categoryId: Int
  categoryName: String
  unit: String
  stock: Float!
  baseCurrency: String!
  prices: [SaleCatalogPrice!]!
  minQuantity: Float
  maxQuantity: Float
}

type SaleCatalogWorker {
  id: Int!
  name: String!
  workerType: String!
  userId: Int
}

# Lo que la pantalla de venta necesita de una tienda
type SaleCatalog {
  office: SaleCatalogOffice
  offices: [SaleCatalogOffice!]!
  currencies: [SaleCatalogCurrency!]!
  defaultCurrency: String
  categories: [SaleCatalogCategory!]!
  products: [SaleCatalogProduct!]!
  workers: [SaleCatalogWorker!]!
  # Trabajador vinculado al usuario de la sesión
  currentWorkerId: Int
  canChooseSeller: Boolean!
}

input CreateSaleInput {
  businessId: Int
  officeId: Int
  departmentId: Int
  teamId: Int

  salesWorkerId: Int
  customerId: Int
  #totalAmount: Float!
  #effectiveDate: Date
  paymentMethod: PaymentMethod
  paymentDetails: JSON
  invoiceNumber: String
  details: [SaleDetailInput!]!

  # NUEVOS CAMPOS DE MENSAJERÍA
  hasDelivery: Boolean
  deliveryWorkerId: Int
  deliveryNotes: String

  # Con pagos la venta se crea ya cobrada
  payments: [MakeSalePaymentInput!]
  baseCurrency: String
  customDate: Date
}

input SaleDetailInput {
  productId: Int!
  quantity: Float!
  publicistIds: [Int!]
}

input UpdateSaleInput {
  businessId: Int
  officeId: Int
  departmentId: Int
  teamId: Int

  id: Int!
  salesWorkerId: Int
  customerId: Int
  #totalAmount: Float
  paymentMethod: PaymentMethod
  paymentDetails: JSON
  invoiceNumber: String

  # NUEVOS CAMPOS DE MENSAJERÍA
  hasDelivery: Boolean
  deliveryWorkerId: Int
  deliveryNotes: String
}

input MakeSalePaymentInput {
  amount: Float!
  currency: String!
  paymentMethod: PaymentMethod!
}

input MakeSaleInput {
  saleId: Int!
  payments: [MakeSalePaymentInput!]!
  baseCurrency: String
  customDate: Date
}

input ValidateSalePaymentsInput {
  saleId: Int!
  payments: [MakeSalePaymentInput!]!
  baseCurrency: String
}

input QuoteSaleInput {
  details: [SaleDetailInput!]!
  payments: [MakeSalePaymentInput!]
  baseCurrency: String
}

input RefundSaleInput {
  saleId: Int
  saleDetailIds: [Int!]
}

extend type Query {
  sales(options: ListOptions): SalesSummary!
  sale(id: Int!): Sale
  salesByCustomer(customerId: Int!): [Sale]!
  saleCatalog(officeId: Int): SaleCatalog!
  quoteSale(quoteSaleInput: QuoteSaleInput!): SaleQuote!
}

extend type Mutation {
  createSale(createSaleInput: CreateSaleInput!): Sale!
  updateSale(updateSaleInput: UpdateSaleInput!): Sale!
  removeSales(ids: [Int!]!): [Sale]!
  restoreSales(ids: [Int!]!): Int

  makeSale(makeSaleInput: MakeSaleInput!): Sale!
  cancelSale(id: Int!): Sale!
  validateSalePayments(
    validateSalePaymentsInput: ValidateSalePaymentsInput
  ): SalePaymentValidation!

  refundSale(refundSaleInput: RefundSaleInput!): Sale!
}

