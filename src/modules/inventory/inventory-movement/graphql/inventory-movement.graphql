"""
Description: Records of product inflows/outflows (e.g., purchases, sales, adjustments).
"""
type InventoryMovement implements SecurityBaseEntity {
  id: Int!
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date

  createdBy: User
  updatedBy: User
  deletedBy: User

  business: Business
  office: Office
  department: Department
  team: Team

  type: MovementType!
  quantity: Int!
  reason: String!
  "La venta que lo causó o la nota escrita al registrarlo a mano"
  referenceId: String
  "Salida que aún reserva existencias para una venta en borrador"
  isReservation: Boolean!
  inventory: Inventory!
  user: User!
}

type InventoryMovementsSummary {
  data: [InventoryMovement]!
  totalCount: Int!
}

enum MovementType {
  IN
  OUT
}

input CreateInventoryMovementInput {
  inventoryId: Int!
  type: MovementType!
  quantity: Int!
  "Uno de los motivos manuales: PURCHASE, RETURN, TRANSFER, INVENTORY_ADJUSTMENT, LOSS, INTERNAL_USE u OTHER"
  reason: String!
  "Nota opcional: factura del proveedor, destino de la transferencia..."
  referenceId: String
}

input TransferInventoryInput {
  "Inventario del que salen las existencias"
  fromInventoryId: Int!
  "Inventario al que entran: el mismo producto y la misma empresa"
  toInventoryId: Int!
  quantity: Int!
  "Nota opcional que acompaña a los dos movimientos"
  note: String
}

"Los dos movimientos de un traslado: la salida del origen y la entrada al destino"
type InventoryTransfer {
  outgoing: InventoryMovement!
  incoming: InventoryMovement!
}

extend type Query {
  inventoryMovements(options: ListOptions): InventoryMovementsSummary!
  inventoryMovement(id: Int!): InventoryMovement
  movementsByInventory(inventoryId: Int!): [InventoryMovement]!
}

extend type Mutation {
  createInventoryMovement(
    createInventoryMovementInput: CreateInventoryMovementInput!
  ): InventoryMovement!
  transferInventory(
    transferInventoryInput: TransferInventoryInput!
  ): InventoryTransfer!
}

