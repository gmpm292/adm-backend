"""
Description: Records of product inflows/outflows (e.g., purchases, sales, adjustments).
"""
type InventoryMovement implements SecurityBaseEntity {
  id: Int!
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date

  createdBy: User
  updatedBy: User
  deletedBy: User

  business: Business
  office: Office
  department: Department
  team: Team

  type: MovementType!
  quantity: Int!
  reason: String!
  "La venta que lo causó o la nota escrita al registrarlo a mano"
  referenceId: String
  "Salida que aún reserva existencias para una venta en borrador"
  isReservation: Boolean!
  inventory: Inventory!
  user: User!
}

type InventoryMovementsSummary {
  data: [InventoryMovement]!
  totalCount: Int!
}

enum MovementType {
  IN
  OUT
}

input CreateInventoryMovementInput {
  inventoryId: Int!
  type: MovementType!
  quantity: Int!
  "Uno de los motivos manuales: PURCHASE, RETURN, TRANSFER, INVENTORY_ADJUSTMENT, LOSS, INTERNAL_USE u OTHER"
  reason: String!
  "Nota opcional: factura del proveedor, destino de la transferencia..."
  referenceId: String
}

input TransferInventoryInput {
  "Inventario del que salen las existencias"
  fromInventoryId: Int!
  "Inventario al que entran: el mismo producto y la misma empresa"
  toInventoryId: Int!
  quantity: Int!
  "Nota opcional que acompaña a los dos movimientos"
  note: String
}

"Los dos movimientos de un traslado: la salida del origen y la entrada al destino"
type InventoryTransfer {
  outgoing: InventoryMovement!
  incoming: InventoryMovement!
}

"Una fila de la hoja de inventario: un producto de la empresa"
type InventorySheetRow {
  product: Product!
  "Sus inventarios en la oficina, uno por ubicación (vacío si no tiene)"
  inventories: [Inventory!]!
  "Lo que hay del producto en la oficina destino, si se pidió una"
  destinationStock: Int
}

"Todos los productos de la empresa con sus existencias en una oficina"
type InventorySheet {
  office: Office!
  "Las demás oficinas de la empresa: adonde se puede enviar"
  destinations: [Office!]!
  rows: [InventorySheetRow!]!
}

"Una línea: un inventario de la oficina o, al cargar, un producto sin inventario allí"
input InventoryLineInput {
  inventoryId: Int
  productId: Int
  quantity: Int!
}

input LoadInventoryInput {
  officeId: Int!
  "INITIAL_INVENTORY, PURCHASE, RETURN, INVENTORY_ADJUSTMENT u OTHER"
  reason: String!
  "Nota para todas las líneas: factura, proveedor..."
  note: String
  lines: [InventoryLineInput!]!
}

input SendInventoryInput {
  fromOfficeId: Int!
  "Otra oficina de la misma empresa"
  toOfficeId: Int!
  note: String
  "Cada línea, un inventario de la oficina de origen"
  lines: [InventoryLineInput!]!
}

type InventoryBatchResult {
  lines: Int!
  units: Int!
  "Inventarios que se abrieron porque el producto no estaba en la oficina"
  createdInventories: Int!
}

extend type Query {
  "Hoja para cargar o enviar varias líneas a la vez; con toOfficeId, lo que hay allí"
  inventorySheet(officeId: Int!, toOfficeId: Int): InventorySheet!
  inventoryMovements(options: ListOptions): InventoryMovementsSummary!
  inventoryMovement(id: Int!): InventoryMovement
  movementsByInventory(inventoryId: Int!): [InventoryMovement]!
}

extend type Mutation {
  createInventoryMovement(
    createInventoryMovementInput: CreateInventoryMovementInput!
  ): InventoryMovement!
  transferInventory(
    transferInventoryInput: TransferInventoryInput!
  ): InventoryTransfer!
  "Entrada de varias líneas en una oficina, todo o nada"
  loadInventory(loadInventoryInput: LoadInventoryInput!): InventoryBatchResult!
  "Envío de varias líneas a otra oficina de la empresa, todo o nada"
  sendInventory(sendInventoryInput: SendInventoryInput!): InventoryBatchResult!
}

