"""
Description: Stock records per office/location.
"""
type Inventory implements SecurityBaseEntity {
  id: Int!
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date

  createdBy: User
  updatedBy: User
  deletedBy: User

  business: Business
  office: Office
  department: Department
  team: Team

  "Existencias: solo cambian con movimientos"
  currentStock: Int!
  "Por debajo de esta cantidad el inventario se marca para reponer"
  minStock: Int
  location: String
  product: Product!
}

type InventoriesSummary {
  data: [Inventory]!
  totalCount: Int!
}

input CreateInventoryInput {
  businessId: Int
  officeId: Int
  departmentId: Int
  teamId: Int

  productId: Int!
  "Existencias iniciales: entran como un movimiento de inventario inicial"
  currentStock: Int!
  minStock: Int
  location: String
}

input UpdateInventoryInput {
  id: Int!
  "null lo quita"
  minStock: Int
  "null lo quita"
  location: String
}

extend type Query {
  inventories(options: ListOptions): InventoriesSummary!
  inventory(id: Int!): Inventory
  inventoriesByProduct(productId: Int!): [Inventory]!
}

extend type Mutation {
  createInventory(createInventoryInput: CreateInventoryInput!): Inventory!
  updateInventory(updateInventoryInput: UpdateInventoryInput!): Inventory!
  removeInventories(ids: [Int!]!): [Inventory]!
  restoreInventories(ids: [Int!]!): Int
}

extend type Subscription {
  inventoryChanged: Boolean
}
